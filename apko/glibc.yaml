contents:
  repositories:
    - '@local ./packages'
  keyring:
    - ./keys/baseless.rsa.pub
  packages:
    - baseless-baselayout@local
    - baseless-ca-certificates@local
    - baseless-tzdata@local
    - baseless-glibc@local

accounts:
  run-as: 65532

environment:
  PATH: /usr/local/bin:/usr/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8
  TZ: UTC

work-dir: /app

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.title: Baseless glibc
  org.opencontainers.image.description: Minimal Baseless runtime for dynamically linked glibc binaries
  org.opencontainers.image.source: https://github.com/morningstar-sudo/baseless
  org.opencontainers.image.vendor: morningstar-sudo
