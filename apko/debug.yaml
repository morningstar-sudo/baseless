contents:
  repositories:
    - '@local ./packages'
  keyring:
    - ./keys/baseless.rsa.pub
  packages:
    - baseless-baselayout@local
    - baseless-ca-certificates@local
    - baseless-tzdata@local
    - baseless-glibc@local
    - baseless-debug-tools@local

accounts:
  run-as: 0

entrypoint:
  command: /bin/sh

environment:
  PATH: /usr/local/bin:/usr/bin:/bin:/sbin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8
  TZ: UTC

work-dir: /app

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.title: Baseless debug
  org.opencontainers.image.description: Baseless diagnostic image with a shell and pinned tools
  org.opencontainers.image.source: https://github.com/morningstar-sudo/baseless
  org.opencontainers.image.url: https://github.com/morningstar-sudo/baseless
  org.opencontainers.image.vendor: morningstar-sudo
  org.opencontainers.image.version: "2026.10"
  org.opencontainers.image.licenses: Apache-2.0
  io.github.morningstar-sudo.baseless.id: baseless
  io.github.morningstar-sudo.baseless.variant: debug
