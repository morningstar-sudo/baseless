package:
  name: baseless-debug-tools
  version: "1.37.0"
  epoch: 31
  description: Pinned diagnostic tools for the Baseless debug image
  copyright:
    - license: GPL-2.0-only AND GPL-2.0-or-later AND curl AND MIT AND Apache-2.0

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - alpine-base
      # Keep runtime payload versions aligned with security/alpine-runtime.purls.
      - brotli-libs=1.2.1-r0
      - busybox=1.37.0-r31
      - c-ares=1.34.9-r0
      - curl=8.22.0-r0
      - jq=1.8.2-r0
      - lddtree=1.27-r0
      - libcrypto3=3.5.9-r0
      - libcurl=8.22.0-r0
      - libidn2=2.3.8-r0
      - libintl=1.0-r0
      - libncursesw=6.6_p20260516-r0
      - libproc2=4.0.6-r0
      - libpsl=0.21.5-r3
      - libssl3=3.5.9-r0
      - libunistring=1.4.2-r0
      - musl=1.2.6-r3
      - ncurses-terminfo-base=6.6_p20260516-r0
      - nghttp2-libs=1.70.0-r0
      - oniguruma=6.9.10-r0
      - openssl=3.5.9-r0
      - procps-ng=4.0.6-r0
      - skalibs-libs=2.15.0.0-r0
      - utmps-libs=0.1.3.3-r0
      - zlib=1.3.2-r1
      - zstd-libs=1.5.7-r2

pipeline:
  - name: Install tools and their closed shared-library set
    runs: |
      copy_elf() {
        binary="$1"
        lddtree -l "${binary}" | while IFS= read -r path; do
          test -e "${path}"
          case "${path}" in
            /bin/*|/sbin/*) target="/usr/bin/${path##*/}" ;;
            /lib/*) target="/usr/lib/${path##*/}" ;;
            *) target="${path}" ;;
          esac
          mkdir -p "${{targets.destdir}}$(dirname "${target}")"
          cp -a "${path}" "${{targets.destdir}}${target}"
        done
      }

      for binary in \
        /bin/busybox \
        /usr/bin/curl \
        /usr/bin/jq \
        /usr/bin/openssl \
        /bin/hugetop \
        /bin/pidof \
        /bin/pidwait \
        /bin/ps \
        /bin/slabtop \
        /bin/tload \
        /bin/vmstat \
        /bin/w \
        /bin/watch \
        /sbin/sysctl \
        /usr/bin/free \
        /usr/bin/pgrep \
        /usr/bin/pkill \
        /usr/bin/pmap \
        /usr/bin/pwdx \
        /usr/bin/top \
        /usr/bin/uptime; do
        copy_elf "${binary}"
      done

      install -Dm644 /etc/ssl/openssl.cnf \
        "${{targets.destdir}}"/etc/ssl/openssl.cnf
      if test -d /usr/lib/ossl-modules; then
        cp -a --parents /usr/lib/ossl-modules "${{targets.destdir}}"
      fi
      if test -d /etc/terminfo; then
        cp -a --parents /etc/terminfo "${{targets.destdir}}"
      fi

      for applet in \
        ash awk base64 basename cat chmod chown cp cut date dd df dirname du \
        echo env false find grep gunzip gzip head id kill less ln ls md5sum mkdir \
        mktemp more mount mv nc netstat nslookup od ping printf pwd readlink \
        realpath rm rmdir sed sha256sum sleep sort stat strings tail tar tee \
        test touch tr true uname uniq unxz vi wc wget which xargs xz; do
        ln -s busybox "${{targets.destdir}}/usr/bin/${applet}"
      done
      ln -s busybox "${{targets.destdir}}/usr/bin/sh"

test:
  pipeline:
    - runs: |
        /bin/sh -c 'test "$(printf test | jq -Rr .)" = test'
        curl --version
        openssl version
        ps --version

update:
  enabled: false

